user  nginx;
# ปรับตามจำนวน CPU Cores จริงของโฮสต์ (หรือ auto)
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # --- SECURITY HARDENING ---
  # 1. ซ่อนเวอร์ชัน Nginx ใน Header และ Error Page
  server_tokens off;

  # 2. กำหนดขนาด Buffer ป้องกัน Buffer Overflow / DoS
  client_body_buffer_size 128k;
  client_header_buffer_size 1k;
  large_client_header_buffers 4 8k;
  
  # จำกัดขนาดไฟลด์อัปโหลดตามความจำเป็น (ปรับตัวเลขตามจริง)
  client_max_body_size 100M;

  # Timeout ป้องกัน Slowloris attack
  client_body_timeout 10s;
  client_header_timeout 10s;
  keepalive_timeout 30s;
  send_timeout 10s;

  # Optimization
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  types_hash_max_size 2048;

  log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

  access_log  /var/log/nginx/access.log  main;

  # ------------------------------------------------------------------
  # HTTP Server - บังคับ Redirect ไปยัง HTTPS
  # ------------------------------------------------------------------
  server {
      listen 80 default_server;
      listen [::]:80 default_server;
      server_name _;

      # บล็อก Bad User Agents
      if ($http_user_agent ~* (ahrefs|wget|crawler|majestic) ) {
          return 403;
      }

      # ส่งทุก HTTP Request ไปที่ HTTPS ทั้งหมด
      return 301 https://$host$request_uri;
  }

  # ------------------------------------------------------------------
  # HTTPS Server
  # ------------------------------------------------------------------
server {
      listen 443 ssl http2;
      listen [::]:443 ssl http2;

      server_name livekit-uat.ramahosp.org;

      ssl_certificate     /etc/certs/cert.crt;
      ssl_certificate_key /etc/certs/private.key;
      ssl_protocols       TLSv1.2 TLSv1.3;
      ssl_ciphers         HIGH:!aNULL:!MD5;
      ssl_prefer_server_ciphers on;

      sendfile off;

      # รองรับ WebSocket สำหรับ LiveKit
      location / {
          proxy_pass http://192.168.0.55:7880;
          
          # HTTP Version และ WebSocket Upgrade Headers
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";
          
          # Headers ส่งค่า Client IP และ Host
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;

          # เพิ่ม Timeout สำหรับ WebSocket เพื่อป้องกันการหลุดเชื่อมต่อ
          proxy_read_timeout 86400s;
          proxy_send_timeout 86400s;
          
          # ปิด Buffering สำหรับการสื่อสารแบบ Real-time
          proxy_buffering off;
      }
          # for livekit-service api create token   
          location /livekit-service/ {
          proxy_pass http://192.168.0.55:8080/;
          
          # HTTP Version และ WebSocket Upgrade Headers
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";
          
          # Headers ส่งค่า Client IP และ Host
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;


      }
  }
}
