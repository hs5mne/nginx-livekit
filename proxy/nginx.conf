user  nginx;
worker_processes  10;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;
events {
  worker_connections  1024;
}
http {
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
  access_log  /var/log/nginx/access.log  main;

  client_max_body_size 2048M;
    
  server {
      listen 80 default_server;

      server_name _;

       if ($http_user_agent ~* (ahrefs|wget|crawler|majestic) ) {
   		 return 403;
       }
       
  }

  server {
      listen 443 ssl;
      listen [::]:443 ssl http2 ipv6only=on;

      server_name _;
      ssl_certificate     /etc/certs/cert.crt;
      ssl_certificate_key /etc/certs/private.key;
#      ssl_certificate     /etc/certs/RA2022.crt;
#      ssl_certificate_key /etc/certs/RA2022.key;
#      ssl_protocols       TLSv1 TLSv1.1 TLSv1.2;
      ssl_protocols       TLSv1.2 TLSv1.3;
      ssl_ciphers         HIGH:!aNULL:!MD5;
#      ssl_protocols       TLSv1.2 TLSv1.3;
#      ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256GCM-SHA384";
      ssl_prefer_server_ciphers on;

      sendfile off;

      gzip on;
      gzip_vary on;
      gzip_comp_level 6;
      gzip_min_length 256;
      gzip_proxied expired no-cache no-store private no_last_modified no_etag auth;
      gzip_types application/atom+xml application/javascript application/json application/ld+json application/manifest+json application/rss+xml application/vnd.geo+json application/vnd.ms-fontobject application/x-font-ttf application/x-web-app-manifest+json application/xhtml+xml application/xml font/opentype image/bmp image/svg+xml image/x-icon text/cache-manifest text/css text/plain text/vcard text/vnd.rim.location.xloc text/vtt text/x-component text/x-cross-domain-policy;

        location / {
                 proxy_pass http://localhost:7880;
                 proxy_set_header Host $host;
                 proxy_set_header X-Real-IP $remote_addr;
                 proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                 proxy_set_header X-Forwarded-Proto $scheme;
                 proxy_http_version 1.1;
                 proxy_set_header Upgrade $http_upgrade;
                 proxy_set_header Connection "upgrade";
                 proxy_read_timeout 86400s; # WebSocket Timeouts
                 proxy_send_timeout 86400s; # WebSocket Timeouts
        }

  }
}
